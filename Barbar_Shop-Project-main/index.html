<!-- ═══════════════════════════════════════════════════════════════════════
     STRUCTURED DATA (JSON-LD) - THIS is what makes Google show your salon
     with a map, rating stars, hours, phone number etc in search results.
     Replace phone/address/hours with YOUR actual details.
════════════════════════════════════════════════════════════════════════ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HairSalon",
  "name": "Jeeva Beauty Salon",
  "image": "https://jeevabeautysaloon.vercel.app/og-image.jpg",
  "url": "https://jeevabeautysaloon.vercel.app/",
  "telephone": "+917904616471",
  "priceRange": "₹₹",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "REPLACE WITH YOUR STREET ADDRESS",
    "addressLocality": "REPLACE WITH YOUR CITY",
    "addressRegion": "REPLACE WITH YOUR STATE",
    "postalCode": "REPLACE WITH PINCODE",
    "addressCountry": "IN"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "REPLACE_WITH_LATITUDE",
    "longitude": "REPLACE_WITH_LONGITUDE"
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
      "opens": "09:00",
      "closes": "19:30"
    }
  ],
  "sameAs": [
    "REPLACE_WITH_FACEBOOK_URL",
    "REPLACE_WITH_INSTAGRAM_URL"
  ]
}
</script>
